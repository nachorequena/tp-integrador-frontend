<!-- Registro público: la tarjeta envuelve al formulario compartido, que llama
     a registrar() y, si sale bien, emite (guardado) → alRegistrarse(). -->
<mat-card class="tarjeta-formulario" appearance="outlined">
  <mat-card-header>
    <mat-icon mat-card-avatar>person_add</mat-icon>
    <mat-card-title>Crear cuenta de paciente</mat-card-title>
    <mat-card-subtitle>Todos los campos son obligatorios</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <app-formulario-paciente
      [guardar]="registrar"
      textoBoton="Registrarme"
      (guardado)="alRegistrarse($event)"
    >
      <a mat-button routerLink="/login">Ya tengo cuenta</a>
    </app-formulario-paciente>
  </mat-card-content>
</mat-card>
