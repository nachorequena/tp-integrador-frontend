<app-encabezado (alternarMenu)="alternarMenu()" />

<mat-sidenav-container class="contenedor">
  <mat-sidenav
    class="menu"
    [mode]="esMovil() ? 'over' : 'side'"
    [opened]="menuAbierto()"
    (openedChange)="alCambiarMenu($event)"
  >
    <app-menu-lateral (navego)="alNavegar()" />
  </mat-sidenav>

  <mat-sidenav-content class="contenido">
    <main class="pantalla">
      <router-outlet />
    </main>
    <app-pie />
  </mat-sidenav-content>
</mat-sidenav-container>
